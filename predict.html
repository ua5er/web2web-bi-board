<style>
/* page-local styles for the Predictions board (kit files untouched) */
.pd-form{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:12px}
.pd-field{display:flex;flex-direction:column;gap:4px;min-width:0}
.pd-field > span{font-size:11px;color:var(--fg-3);white-space:nowrap}
.pd-field .input.num{width:84px}
.pd-sliders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px}
.pd-slider{display:flex;flex-direction:column;gap:4px;min-width:0}
.pd-slider .hd{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--fg-2)}
.pd-slider .hd b{font-family:var(--mono);font-weight:500;color:var(--fg)}
.pd-slider .hd .base{font-size:11px;color:var(--fg-4);margin-left:6px;font-family:var(--mono)}
.pd-slider input[type=range]{width:100%;height:20px;margin:0;accent-color:var(--accent);background:transparent;cursor:pointer}
.pd-slider .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--fg-4);font-family:var(--mono)}
.pd-out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.pd-out .box{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;min-width:0}
.pd-out .lbl{font-size:11px;color:var(--fg-3);margin-bottom:4px}
.pd-out .val{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.1}
.pd-out .val small{font-size:11px;font-weight:400;color:var(--fg-3);margin-left:6px}
.pd-out .cmp{font-size:11px;color:var(--fg-3);margin-top:4px;font-family:var(--mono)}
.pd-howto{font-size:12px;color:var(--fg-2);line-height:1.55;max-width:900px}
.pd-howto h3{font-size:12px;font-weight:600;color:var(--fg);margin:12px 0 4px}
.pd-howto h3:first-child{margin-top:0}
.pd-howto ol,.pd-howto ul{padding-left:20px;margin:4px 0}
.pd-howto li{margin:3px 0}
.pd-howto code{font-family:var(--mono);font-size:11px;background:var(--bg-2);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--fg)}
.pd-sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:0;background:var(--line-2);flex:none}
.tbl tr.sel td.sticky-col{box-shadow:inset 2px 0 0 var(--accent)}
.tbl tr.sel td.sticky-col .pd-sw{outline:1px solid var(--fg-3);outline-offset:1px}
.pd-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--fg-3);align-items:center}
.pd-legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--fg-3);margin-right:6px;vertical-align:middle}
.pd-legend i.dash{border-top-style:dashed}
.pd-legend i.band{height:8px;border:0;background:rgba(var(--accent-rgb),.18);border-radius:2px}
.pd-seg-list{margin-top:10px}
.pd-chart-tall{height:300px}
.pd-note{font-size:11px;color:var(--fg-4);margin-top:8px}
.mix-bar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--bg-2);min-width:180px}
.mix-bar span{display:block;min-width:1px;font-size:10px;line-height:16px;color:#fff;text-align:center;overflow:hidden;white-space:nowrap;opacity:.9}
.pd-out-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pd-out-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pd-out .val.good{color:var(--good)}.pd-out .val.bad{color:var(--bad)}.pd-out .val.warn{color:var(--warn)}
.pd-seg{display:inline-flex;flex-direction:column;gap:1px;line-height:1.25;white-space:nowrap}
.pd-segk{font-family:var(--mono);font-size:11px;color:var(--fg-2)}
.pd-segf{font-size:11px;color:var(--warn)}
.pd-segf.dim{color:var(--fg-4)}
.pd-alloc-charts{margin-top:14px}
.pd-sub{min-width:0}
.pd-sub-t{font-size:11px;color:var(--fg-3);margin-bottom:6px}
@media (max-width:900px){.pd-out-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.pd-out-3,.pd-out-4{grid-template-columns:minmax(0,1fr)}}
/* M. "Prediction models" panel */
.pd-models{display:flex;flex-direction:column;gap:10px}
.pd-md-h{font-size:12px;font-weight:600;color:var(--fg);margin-top:4px}
.pd-md-h .caption{font-weight:400;color:var(--fg-3)}
.pd-md-sec{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--bg-1)}
.pd-md-sec .alerts .alert .at{white-space:normal}
.pd-md-more{margin:6px 10px}
.pd-mfam{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);white-space:normal}
.pd-skill{font-size:10.5px;color:var(--fg-2);white-space:normal;word-break:break-word}
.pd-fit{display:inline-flex;align-items:baseline;gap:2px;white-space:nowrap}
.pd-models input[type=radio]{width:16px;height:16px;margin:0;accent-color:var(--accent);cursor:pointer}
.pd-models input[type=radio]:disabled{cursor:not-allowed;opacity:.4}
.pd-verdict{font-size:12px;color:var(--fg-2);line-height:1.5;margin:10px 12px 0}
.pd-agree{padding:10px 12px 12px}
.pd-agree-chart{height:240px;position:relative}
.pd-banner{display:flex;gap:8px;align-items:flex-start;padding:10px 14px;border-radius:var(--radius);font-size:12px;line-height:1.45;color:var(--fg);background:rgba(var(--warn-rgb),.12);border:1px solid rgba(var(--warn-rgb),.4)}
.pd-banner b{color:var(--warn-ink);white-space:nowrap}
.pd-kv{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;font-size:12px}
.pd-kv > div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:3px 0}
.pd-kv .k{color:var(--fg-3)}
.pd-kv .v{text-align:right;word-break:break-word}
.tbl tr.sel td.sticky-col input[type=radio]{outline:2px solid rgba(var(--accent-rgb),.35);outline-offset:2px;border-radius:50%}
@media (max-width:900px){.pd-agree-chart{height:200px}}
/* header badges (model · signals · payers · allocated · scenario) wrap on phones instead of widening the page */
@media (max-width:600px){.bb-head .head-actions{flex-wrap:wrap;justify-content:flex-end;max-width:100%}}
/* kit: the 6-option «Канал» segmented control is wider than a 390px viewport → let it wrap on phones (page-local until fixed in style.css) */
@media (max-width:600px){.bb-toolbar .seg.channel{flex-wrap:wrap;height:auto}}
@media (max-width:900px){.pd-sliders{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.pd-out{grid-template-columns:minmax(0,1fr)}}
/* plan-mix legend badges are long (plan · price · trial · share · pLTV): let them wrap on phones */
@media (max-width:600px){.badge.mono{white-space:normal;height:auto;min-height:18px;max-width:100%;line-height:1.35;padding:2px 6px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
